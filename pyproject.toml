[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cyclesmith"
version = "0.1.0"
description = "Reusable autonomous planner-worker-judge development loop tooling."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "CycleSmith" }]
dependencies = ["ruff", "ty", "pytest"]

[project.scripts]
cyclesmith = "cyclesmith.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cyclesmith"]

[tool.hatch.build.targets.wheel.force-include]
"src/cyclesmith/templates" = "cyclesmith/templates"

[tool.hatch.build.targets.sdist]
include = ["src/cyclesmith", "tests", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "UP",
  "B",
  "SIM",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -p no:tmpdir"

[tool.ty.src]
include = ["src", "tests"]
